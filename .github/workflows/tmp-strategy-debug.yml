name: Temp Strategy Test Debug

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Run strategy sync debug script
        run: |
          dart run test/tool/strategy_sync_debug.dart
