name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 取消同一分支上正在进行的旧运行，节省额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (static)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        shell: bash
        run: |
          set +e
          flutter analyze --machine --no-fatal-warnings --no-fatal-infos > analyzer.txt 2>&1
          status=$?
          while IFS= read -r message; do
            [[ "$message" != *"error •"* ]] && continue
            message=${message//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            echo "::error title=Flutter Analyzer::$message"
          done < analyzer.txt
          exit "$status"

  test-android:
    name: Test (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # 允许 KVM 加速（Android 模拟器必需）。
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 接受 Android SDK 许可，避免 sdkmanager 交互式卡住。
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      # 在已启动的 Android 模拟器上跑 flutter test：
      # 设备已连接时 flutter test 为 Android 平台编译，webview_flutter 等插件可正常编译。
      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          script: |
            set +e
            flutter test --machine --dart-define=FLUTTER_TEST=true -d emulator-5554 > test-results-android.jsonl 2>&1
            status=$?
            python3 - <<'PY'
            import json
            from pathlib import Path
            lines = Path('test-results-android.jsonl').read_text(errors='replace').splitlines()
            tests = {}
            for raw in lines:
                try:
                    event = json.loads(raw)
                except json.JSONDecodeError:
                    continue
                if not isinstance(event, dict):
                    continue
                if event.get('type') == 'testStart':
                    test = event.get('test') or {}
                    tests[test.get('id')] = test.get('name', test.get('url', 'unknown test'))
                elif event.get('type') == 'print' and ('EXCEPTION' in str(event.get('message')) or 'TestFailure' in str(event.get('message'))):
                    message = str(event.get('message', 'Test failure'))[:1200]
                    message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                    print(f'::error title=Flutter Test exception::{message}')
                elif event.get('type') == 'error':
                    message = str(event.get('error', 'Test error'))[:1200]
                    message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                    print(f'::error title=Flutter Test error::{message}')
                elif event.get('type') == 'testDone' and event.get('result') not in ('success', 'skipped'):
                    test_id = event.get('testID')
                    message = f"{tests.get(test_id, test_id)} ({event.get('result')})"
                    print(f'::error title=Flutter Test failed::{message}')
            PY
            exit "$status"

      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-android-results
          path: test-results-android.jsonl
          retention-days: 3
          if-no-files-found: ignore

  test-ios:
    name: Test (iOS simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # 选定 Xcode 工具链（macOS runner 预装）。
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # 创建并启动一台 iOS 模拟器；将 UDID 写入环境变量供后续步骤使用。
      - name: Start iOS Simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+' | tail -1)
          echo "Using runtime: $RUNTIME"
          UDID=$(xcrun simctl create "CI iPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-15" "$RUNTIME" 2>/dev/null || echo "")
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -E 'iPhone 15' | head -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          fi
          echo "Simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          open -a Simulator
          xcrun simctl bootstatus "$UDID" -b
          echo "IOS_UDID=$UDID" >> "$GITHUB_ENV"

      # 在 iOS 模拟器上跑 flutter test：为 iOS 平台编译，webview_flutter 等插件可正常编译。
      - name: Run tests on iOS simulator
        run: |
          set +e
          flutter test --machine --dart-define=FLUTTER_TEST=true -d "$IOS_UDID" > test-results-ios.jsonl 2>&1
          status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          lines = Path('test-results-ios.jsonl').read_text(errors='replace').splitlines()
          tests = {}
          for raw in lines:
              try:
                  event = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              if not isinstance(event, dict):
                  continue
              if event.get('type') == 'testStart':
                  test = event.get('test') or {}
                  tests[test.get('id')] = test.get('name', test.get('url', 'unknown test'))
              elif event.get('type') == 'print' and ('EXCEPTION' in str(event.get('message')) or 'TestFailure' in str(event.get('message'))):
                  message = str(event.get('message', 'Test failure'))[:1200]
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title=Flutter Test exception::{message}')
              elif event.get('type') == 'error':
                  message = str(event.get('error', 'Test error'))[:1200]
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title=Flutter Test error::{message}')
              elif event.get('type') == 'testDone' and event.get('result') not in ('success', 'skipped'):
                  test_id = event.get('testID')
                  message = f"{tests.get(test_id, test_id)} ({event.get('result')})"
                  print(f'::error title=Flutter Test failed::{message}')
          PY
          exit "$status"

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-ios-results
          path: test-results-ios.jsonl
          retention-days: 3
          if-no-files-found: ignore
