name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 取消同一分支上正在进行的旧运行，节省额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (static)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        shell: bash
        run: |
          set +e
          flutter analyze --machine --no-fatal-warnings --no-fatal-infos > analyzer.txt 2>&1
          status=$?
          while IFS= read -r message; do
            [[ "$message" != *"error •"* ]] && continue
            message=${message//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            echo "::error title=Flutter Analyzer::$message"
          done < analyzer.txt
          exit "$status"

  test-android:
    name: Test (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # 允许 KVM 加速（Android 模拟器必需）。
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 接受 Android SDK 许可，避免 sdkmanager 交互式卡住。
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      # 在已启动的 Android 模拟器上跑 flutter test：
      # 设备已连接时 flutter test 为 Android 平台编译，webview_flutter 等插件可正常编译。
      # 注意：android-emulator-runner 会把 script 的每一行当作独立 shell 命令执行，
      # 因此不能写多行 heredoc；解析逻辑抽到 scripts/parse_flutter_test.py 用单行调用。
      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          script: |
            flutter test --machine --dart-define=FLUTTER_TEST=true -d emulator-5554 > test-results-android.jsonl 2>&1
            python3 scripts/parse_flutter_test.py test-results-android.jsonl

      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-android-results
          path: test-results-android.jsonl
          retention-days: 3
          if-no-files-found: ignore

  test-ios:
    name: Test (iOS simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # 选定 Xcode 工具链（macOS runner 预装）。
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # 创建并启动一台 iOS 模拟器；将 UDID 写入环境变量供后续步骤使用。
      - name: Start iOS Simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+' | tail -1)
          echo "Using runtime: $RUNTIME"
          UDID=$(xcrun simctl create "CI iPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-15" "$RUNTIME" 2>/dev/null || echo "")
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -E 'iPhone 15' | head -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          fi
          echo "Simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          open -a Simulator
          xcrun simctl bootstatus "$UDID" -b
          echo "IOS_UDID=$UDID" >> "$GITHUB_ENV"

      # 在 iOS 模拟器上跑 flutter test：为 iOS 平台编译，webview_flutter 等插件可正常编译。
      - name: Run tests on iOS simulator
        run: |
          flutter test --machine --dart-define=FLUTTER_TEST=true -d "$IOS_UDID" > test-results-ios.jsonl 2>&1
          python3 scripts/parse_flutter_test.py test-results-ios.jsonl

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-ios-results
          path: test-results-ios.jsonl
          retention-days: 3
          if-no-files-found: ignore
